# Takes Recap's App Store screenshots in the iPhone simulator. Run by .github/workflows/ios.yml
# (Actions > iOS build > Run workflow, "screenshots" ticked) after it has copied the demo database
# (scripts/demo-db.test.ts) into the app, so the screens show the demo decks:
#   maestro test --test-output-dir DIR .maestro/screenshots.yaml
# Screenshots land in DIR/<run>/<flow>/takeScreenshot/; the names match the store graphics script
# (home, study, voices, library, stats, leaderboard, sync, ai, ai-review). Buttons are found by
# their accessibility labels. Never clearState here: it would wipe the demo database.
# 1.0.4: the shots lead with what's Recap's own: a typed answer checked with a suggested grade,
# each deck read aloud in its own languages, and Create with AI in two languages.
appId: com.recapcards.app
---
- launchApp
- extendedWaitUntil:
    visible: 'Study · .* due'
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: home

# Typed recall. "Vietnamese words" has one card due, "apple" (scripts/demo-data.ts): type its
# meaning without the accents and check it. Recap marks the letters missing theirs, says "Almost:
# check the accents" and highlights Hard. Nothing is graded, so the data stays the same.
# The demo decks are in groups (scripts/demo-data.ts): Vietnamese words is in Languages.
# Home has 15 rows: on the folded iPhone Duo, Languages is below the fold.
- scrollUntilVisible:
    element:
      text: 'Languages.*'
    direction: DOWN
- tapOn: 'Languages.*'
- extendedWaitUntil:
    visible: 'Vietnamese words.*'
    timeout: 30000
- tapOn: 'Vietnamese words.*'
- extendedWaitUntil:
    visible: 'Study this deck.*'
    timeout: 30000
- tapOn: 'Study this deck.*'
- extendedWaitUntil:
    visible: 'Your answer.*'
    timeout: 30000
- tapOn: 'Your answer.*'
- inputText: 'qua tao'
- tapOn: Check
- extendedWaitUntil:
    visible: 'Almost.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: study

# Each deck's own voices: Spanish basics is read in Spanish and English. The shot shows the list
# of 19 languages open, with Español ticked (nothing is changed).
- launchApp
- extendedWaitUntil:
    visible: 'Study · .* due'
    timeout: 60000
# Home has 15 rows: on the folded iPhone Duo, Languages is below the fold.
- scrollUntilVisible:
    element:
      text: 'Languages.*'
    direction: DOWN
- tapOn: 'Languages.*'
- extendedWaitUntil:
    visible: 'Spanish basics.*'
    timeout: 30000
- tapOn: 'Spanish basics.*'
- extendedWaitUntil:
    visible: 'Study this deck.*'
    timeout: 30000
- tapOn: Edit deck
- extendedWaitUntil:
    visible: Read aloud in
    timeout: 30000
- tapOn: 'Language of the card fronts.*'
- extendedWaitUntil:
    visible: Read the front of the cards in
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: voices

# The Library, scrolled to TOEIC (nothing is added).
- launchApp
- extendedWaitUntil:
    visible: 'Study · .* due'
    timeout: 60000
- tapOn: Library
- extendedWaitUntil:
    visible: All
    timeout: 30000
- scrollUntilVisible:
    element:
      text: TOEIC vocabulary
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: library

- launchApp
- extendedWaitUntil:
    visible: 'Study · .* due'
    timeout: 60000
- tapOn: Statistics
- extendedWaitUntil:
    visible: 'Cards studied, last 7 days'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: stats
# The leaderboard (1.0.8): the screenshot build's made-up board (EXPO_PUBLIC_DEMO_BOARD in the
# workflow, src/lib/leaderboard/demo.ts), with the demo's own 15-day streak among the others.
# On the folded iPhone Duo the button is at the bottom edge, and with longer words (French,
# Spanish, Portuguese, Hindi, Bengali) the page can't scroll it fully into view: about 60% of it
# shows (2026-11-09). Half is enough to tap its middle.
- scrollUntilVisible:
    element:
      text: Leaderboard
    direction: DOWN
    visibilityPercentage: 50
- tapOn: Leaderboard
- extendedWaitUntil:
    visible: '.*Minh Anh.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: leaderboard

# Sync (1.0.8): Settings › Sync my cards, signed out: what sync does and the three ways to sign in.
# Nothing is tapped there.
- launchApp
- extendedWaitUntil:
    visible: 'Study · .* due'
    timeout: 60000
- tapOn: Settings
- tapOn: 'Sync my cards.*'
- extendedWaitUntil:
    visible: Continue with Google
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: sync

# Checks, not for the stores (the slides script only takes the names above): the two sheets
# with the keyboard open, scrolled down, so the screenshots show whether Save can still be
# reached. On an iPad these open as sheets with space around them. Nothing is typed or saved.
- launchApp
- extendedWaitUntil:
    visible: 'Study · .* due'
    timeout: 60000
- tapOn: Add a deck or card
- tapOn: Add card
- extendedWaitUntil:
    visible: Front
    timeout: 30000
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: check-card-editor
# Start again rather than tap Cancel: on the folded iPhone Duo the deck form's top bar (title and
# Cancel) was gone after scrolling with the keyboard open (2026-11-05), and the run stopped there.
- launchApp
- extendedWaitUntil:
    visible: 'Study · .* due'
    timeout: 60000
- tapOn: Add a deck or card
- tapOn: New deck
- extendedWaitUntil:
    visible: Deck name
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: check-deck-form-top
- scroll
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: check-deck-form

# Create with AI in two languages. It uses the real server (the workflow wakes it up first) and
# the free Gemini quota, so it comes last.
- launchApp
- extendedWaitUntil:
    visible: 'Study · .* due'
    timeout: 60000
- tapOn: Add a deck or card
- tapOn: Create with AI
# The tab is "Topic"; its text box has its own label (Android adds the placeholder to it).
- tapOn: Topic
- tapOn: 'Topic to make cards about.*'
- inputText: Vietnamese words for food
# Close the keyboard with its Done key (hideKeyboard is unreliable on iOS; on a small screen like
# the folded iPhone Duo the keyboard covers the rest of the form, so a tap could land on a key).
- pressKey: Enter
# A ticked language reads "Tiếng Việt, ✓" (a second try finds it ticked by the first).
- tapOn: 'Language of the card fronts.*'
- tapOn: 'Tiếng Việt(, ✓)?'
- tapOn: 'Language of the card backs.*'
- tapOn: 'English(, ✓)?'
# The pick took: the button names the language now. A row half under the list's bottom edge
# counts as visible, so a tap on it missed (folded Duo and iPhone, 2026-11-09); the other
# languages' flows scroll to the language after theirs first (scripts/screenshot-flows.js).
- extendedWaitUntil:
    visible: 'Language of the card backs: English.*'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ai
- tapOn: Make cards
# iPhone asks once before sending text to Google Gemini (src/features/ai/consent.ts).
- tapOn:
    text: Allow
    optional: true
- extendedWaitUntil:
    visible: Review cards
    timeout: 150000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ai-review
