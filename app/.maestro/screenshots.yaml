# Takes Recap's App Store screenshots in the iPhone simulator. Run by .github/workflows/ios.yml
# (Actions > iOS build > Run workflow, "screenshots" ticked) after it has copied the demo database
# (scripts/demo-db.test.ts) into the app, so the screens show the demo decks:
#   maestro test --test-output-dir DIR .maestro/screenshots.yaml
# Screenshots land in DIR/<run>/<flow>/takeScreenshot/; the names match the store graphics script
# (home, study, voices, library, stats, ai, ai-review). Buttons are found by their accessibility
# labels. Never clearState here: it would wipe the demo database.
# 1.0.4: the shots lead with what's Recap's own: a typed answer checked with a suggested grade,
# each deck read aloud in its own languages, and Create with AI in two languages.
appId: com.recapcards.app
---
- launchApp
- extendedWaitUntil:
    visible: 'Study · .* due'
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: home

# Typed recall. "German words" has one card due, "der Apfel" (scripts/demo-data.ts): type a near
# miss and check it. Recap marks the swapped letters, says "Almost: check the spelling" and
# highlights Hard. Nothing is graded, so the data stays the same.
- tapOn: 'German words.*'
- extendedWaitUntil:
    visible: 'Study this deck.*'
    timeout: 30000
- tapOn: 'Study this deck.*'
- extendedWaitUntil:
    visible: 'Your answer.*'
    timeout: 30000
- tapOn: 'Your answer.*'
- inputText: 'the appel'
- tapOn: Check
- extendedWaitUntil:
    visible: 'Almost.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: study

# Each deck's own voices: Spanish basics is read in Spanish and English. The shot shows the list
# of 12 languages open, with Español ticked (nothing is changed).
- launchApp
- extendedWaitUntil:
    visible: 'Study · .* due'
    timeout: 60000
- tapOn: 'Spanish basics.*'
- extendedWaitUntil:
    visible: 'Study this deck.*'
    timeout: 30000
- tapOn: Edit deck
- extendedWaitUntil:
    visible: Read aloud in
    timeout: 30000
- tapOn: 'Language of the card fronts.*'
- extendedWaitUntil:
    visible: Read the front of the cards in
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: voices

# The Library of ready-made decks, scrolled to TOEIC (nothing is added).
- launchApp
- extendedWaitUntil:
    visible: 'Study · .* due'
    timeout: 60000
- tapOn: Library
- extendedWaitUntil:
    visible: 'Ready-made decks.*'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: TOEIC vocabulary
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: library

- launchApp
- extendedWaitUntil:
    visible: 'Study · .* due'
    timeout: 60000
- tapOn: Statistics
- extendedWaitUntil:
    visible: 'Cards studied, last 7 days'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: stats

# Create with AI in two languages. It uses the real server (the workflow wakes it up first) and
# the free Gemini quota, so it comes last.
- launchApp
- extendedWaitUntil:
    visible: 'Study · .* due'
    timeout: 60000
- tapOn: Add a deck or card
- tapOn: Create with AI
# The tab is "Topic"; its text box has its own label (Android adds the placeholder to it).
- tapOn: Topic
- tapOn: 'Topic to make cards about.*'
- inputText: German words for food
# Close the keyboard the way a person would: tap something that isn't a button (hideKeyboard
# is unreliable on iOS).
- tapOn: Cards
- tapOn: 'Language of the card fronts.*'
- tapOn: Deutsch
- tapOn: 'Language of the card backs.*'
- tapOn: English
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ai
- tapOn: Make cards
# iPhone asks once before sending text to Google Gemini (src/features/ai/consent.ts).
- tapOn:
    text: Allow
    optional: true
- extendedWaitUntil:
    visible: Review cards
    timeout: 150000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ai-review
