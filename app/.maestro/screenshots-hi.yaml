# The App Store screenshots with the app in hi (the workflow's language "hi" makes the
# demo database with Settings › Language set to it): the same steps as screenshots.yaml, every
# label it taps or waits for taken from src/lib/i18n/hi.ts. The study deck is "English
# words", with this language's cards (scripts/demo-data.ts). Made by
# scripts/screenshot-flows.js: change screenshots.yaml, then run it again. The comments below
# are the English flow's.
appId: com.recapcards.app
---
- launchApp
- extendedWaitUntil:
    visible: 'पढ़ें · .* बाकी'
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: home

# Typed recall. "Vietnamese words" has one card due, "apple" (scripts/demo-data.ts): type its
# meaning without the accents and check it. Recap marks the letters missing theirs, says "Almost:
# check the accents" and highlights Hard. Nothing is graded, so the data stays the same.
# The demo decks are in groups (scripts/demo-data.ts): Vietnamese words is in Languages.
# Home has 15 rows: on the folded iPhone Duo, Languages is below the fold.
- scrollUntilVisible:
    element:
      text: 'Languages.*'
    direction: DOWN
- tapOn: 'Languages.*'
- extendedWaitUntil:
    visible: 'English words.*'
    timeout: 30000
- tapOn: 'English words.*'
- extendedWaitUntil:
    visible: 'यह डेक पढ़ें.*'
    timeout: 30000
- tapOn: 'यह डेक पढ़ें.*'
- extendedWaitUntil:
    visible: 'आपका जवाब.*'
    timeout: 30000
- tapOn: 'आपका जवाब.*'
- inputText: aple
- tapOn: 'जाँचें'
- extendedWaitUntil:
    visible: 'लगभग सही.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: study

# Each deck's own voices: Spanish basics is read in Spanish and English. The shot shows the list
# of 19 languages open, with Español ticked (nothing is changed).
- launchApp
- extendedWaitUntil:
    visible: 'पढ़ें · .* बाकी'
    timeout: 60000
# Home has 15 rows: on the folded iPhone Duo, Languages is below the fold.
- scrollUntilVisible:
    element:
      text: 'Languages.*'
    direction: DOWN
- tapOn: 'Languages.*'
- extendedWaitUntil:
    visible: 'Spanish basics.*'
    timeout: 30000
- tapOn: 'Spanish basics.*'
- extendedWaitUntil:
    visible: 'यह डेक पढ़ें.*'
    timeout: 30000
- tapOn: 'डेक बदलें'
- extendedWaitUntil:
    visible: 'पढ़कर सुनाने की भाषा'
    timeout: 30000
- tapOn: 'कार्ड के सामने वाले हिस्से की भाषा.*'
- extendedWaitUntil:
    visible: 'कार्ड का सामने वाला हिस्सा किस भाषा में पढ़ें'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: voices

# The Library of ready-made decks, scrolled to TOEIC (nothing is added).
- launchApp
- extendedWaitUntil:
    visible: 'पढ़ें · .* बाकी'
    timeout: 60000
- tapOn: 'लाइब्रेरी'
- extendedWaitUntil:
    visible: 'आपके डेक में जोड़ने के लिए तैयार डेक।.*'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: TOEIC vocabulary
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: library

- launchApp
- extendedWaitUntil:
    visible: 'पढ़ें · .* बाकी'
    timeout: 60000
- tapOn: 'आँकड़े'
- extendedWaitUntil:
    visible: 'पिछले 7 दिनों में पढ़े गए कार्ड'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: stats
# The leaderboard (1.0.8): the screenshot build's made-up board (EXPO_PUBLIC_DEMO_BOARD in the
# workflow, src/lib/leaderboard/demo.ts), with the demo's own 15-day streak among the others.
# On the folded iPhone Duo the button is at the bottom edge, and with longer words (French,
# Spanish, Portuguese, Hindi, Bengali) the page can't scroll it fully into view: about 60% of it
# shows (2026-11-09). Half is enough to tap its middle.
- scrollUntilVisible:
    element:
      text: 'लीडरबोर्ड'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'लीडरबोर्ड'
- extendedWaitUntil:
    visible: '.*अनन्या.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: leaderboard

# Sync (1.0.8): Settings › Sync my cards, signed out: what sync does and the three ways to sign in.
# Nothing is tapped there.
- launchApp
- extendedWaitUntil:
    visible: 'पढ़ें · .* बाकी'
    timeout: 60000
- tapOn: 'सेटिंग'
- tapOn: 'मेरे कार्ड सिंक करें.*'
- extendedWaitUntil:
    visible: 'Google से जारी रखें'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: sync

# Checks, not for the stores (the slides script only takes the names above): the two sheets
# with the keyboard open, scrolled down, so the screenshots show whether Save can still be
# reached. On an iPad these open as sheets with space around them. Nothing is typed or saved.
- launchApp
- extendedWaitUntil:
    visible: 'पढ़ें · .* बाकी'
    timeout: 60000
- tapOn: 'डेक या कार्ड जोड़ें'
- tapOn: 'कार्ड जोड़ें'
- extendedWaitUntil:
    visible: 'सामने'
    timeout: 30000
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: check-card-editor
# Start again rather than tap Cancel: on the folded iPhone Duo the deck form's top bar (title and
# Cancel) was gone after scrolling with the keyboard open (2026-11-05), and the run stopped there.
- launchApp
- extendedWaitUntil:
    visible: 'पढ़ें · .* बाकी'
    timeout: 60000
- tapOn: 'डेक या कार्ड जोड़ें'
- tapOn: 'नया डेक'
- extendedWaitUntil:
    visible: 'डेक का नाम'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: check-deck-form-top
- scroll
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: check-deck-form

# Create with AI in two languages. It uses the real server (the workflow wakes it up first) and
# the free Gemini quota, so it comes last.
- launchApp
- extendedWaitUntil:
    visible: 'पढ़ें · .* बाकी'
    timeout: 60000
- tapOn: 'डेक या कार्ड जोड़ें'
- tapOn: 'AI से बनाएँ'
# The tab is "Topic"; its text box has its own label (Android adds the placeholder to it).
- tapOn: 'विषय'
- tapOn: 'जिस विषय पर कार्ड बनाने हैं.*'
- inputText: 'खाने से जुड़े अंग्रेज़ी शब्द'
# Close the keyboard with its Done key (hideKeyboard is unreliable on iOS; on a small screen like
# the folded iPhone Duo the keyboard covers the rest of the form, so a tap could land on a key).
- pressKey: Enter
# A ticked language reads "Tiếng Việt, ✓" (a second try finds it ticked by the first).
- tapOn: 'कार्ड के सामने वाले हिस्से की भाषा.*'
- tapOn: 'English(, ✓)?'
- tapOn: 'कार्ड के पीछे वाले हिस्से की भाषा.*'
- scrollUntilVisible:
    element:
      text: 'বাংলা(, ✓)?'
    direction: DOWN
- tapOn: 'हिन्दी(, ✓)?'
# The pick took: the button names the language now. A row half under the list's bottom edge
# counts as visible, so a tap on it missed (folded Duo and iPhone, 2026-11-09); the other
# languages' flows scroll to the language after theirs first (scripts/screenshot-flows.js).
- extendedWaitUntil:
    visible: 'कार्ड के पीछे वाले हिस्से की भाषा: हिन्दी.*'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ai
- tapOn: 'कार्ड बनाएँ'
# iPhone asks once before sending text to Google Gemini (src/features/ai/consent.ts).
- tapOn:
    text: 'अनुमति दें'
    optional: true
- extendedWaitUntil:
    visible: 'कार्ड देखें'
    timeout: 150000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ai-review
