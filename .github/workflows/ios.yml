name: iOS build

# Builds the iPhone app on GitHub's macOS machines (free, because the repo is public), so iOS can
# be developed without a Mac. Unsigned and for the simulator: it proves the iOS app still compiles.
# Signed TestFlight builds are made by Codemagic (codemagic.yaml).
#
# ios/ is generated by `expo prebuild` from app.json (never committed), so every run makes it fresh.
# Runs when the app changes on main, or by hand: Actions > iOS build > Run workflow (pick a branch).
# App Store screenshots only when asked: tick "screenshots" when running it by hand.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      screenshots:
        description: Also take App Store screenshots in the iPhone simulator
        type: boolean
        default: true

jobs:
  ios:
    name: iOS (simulator, unsigned)
    # macOS 26 has Xcode 26.4+, which Expo SDK 57 needs (macos-15 is too old).
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.screenshots }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Generate the iOS project from app.json
        run: npx expo prebuild --platform ios --no-install
      - name: Show the settings App Review looks at
        run: |
          plutil -p ios/Recap/Info.plist | grep -E -A4 'CFBundle(ShortVersionString|Version)"|ITSAppUses|NSAppTransportSecurity|Usage' || true
          echo "--- entitlements (Recap uses no push, so this should be empty)"
          cat ios/Recap/Recap.entitlements 2>/dev/null || echo "(no entitlements file)"
          echo "--- versioning (agvtool in codemagic.yaml needs apple-generic)"
          grep -E 'VERSIONING_SYSTEM|CURRENT_PROJECT_VERSION' ios/Recap.xcodeproj/project.pbxproj | sort -u || true
      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: pod install
      - name: Build (Release, so the JavaScript bundle is built too)
        working-directory: app/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Recap.xcworkspace -scheme Recap -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Keep the build log and the generated iOS settings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build
          path: |
            app/ios/build.log
            app/ios/Podfile.lock
            app/ios/Recap/Info.plist
            app/ios/Recap/Recap.entitlements
            app/ios/Recap/PrivacyInfo.xcprivacy
          if-no-files-found: ignore

      # ---- Screenshots (only when asked) ------------------------------------------------------
      # The demo decks come from a ready-made database (scripts/demo-db.test.ts: the app's own
      # migrations + backup import), copied into the app before Maestro taps through the screens
      # (.maestro/screenshots.yaml). "Create with AI" uses the live server and Gemini.
      - name: 'Screenshots: make the demo database'
        if: env.SCREENSHOTS == 'true'
        run: MAKE_DEMO_DB="$RUNNER_TEMP/recap.db" npx jest scripts/demo-db --ci
      - uses: actions/setup-java@v6
        if: env.SCREENSHOTS == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Maestro
        if: env.SCREENSHOTS == 'true'
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Wake up the server (Render's free plan sleeps)
        if: env.SCREENSHOTS == 'true'
        run: |
          for i in $(seq 1 18); do
            curl -sf --max-time 20 https://recap-api-ictj.onrender.com/health && exit 0
            sleep 10
          done
          echo "The server didn't answer; the AI screenshots may be missing."
      - name: Screenshots in the iPhone simulator
        if: env.SCREENSHOTS == 'true'
        env:
          # Maestro's helper inside the simulator can take minutes to start on a busy machine.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        run: |
          set -euo pipefail
          APP=ios/build/Build/Products/Release-iphonesimulator/Recap.app
          # iPhone 17 Pro Max if there is one (1320 x 2868), otherwise the newest Pro Max. The App
          # Store's required size, 1206 x 2622, is made from these by the store graphics script
          # (DesktopRecap-appstore-listing	ools); both have the same shape.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.split(".iOS-")[1].split("-"))
              for d in devices:
                  if "Pro Max" in d["name"]:
                      key = (d["name"] == "iPhone 17 Pro Max", version)
                      if best is None or key > best[0]:
                          best = (key, d["udid"], d["name"] + " / iOS " + ".".join(map(str, version)))
          print(best[1]); print("Simulator:", best[2], file=sys.stderr)')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          # The tidy status bar of App Store screenshots: 9:41, full battery and NOT charging
          # ("charged" still shows the charging bolt).
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState discharging \
            --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$UDID" "$APP"

          # Launch once so iOS makes the app's folders, then swap in the demo database
          # (expo-sqlite keeps it in Documents/SQLite). The welcome decks never appear: the demo
          # database is marked as already seeded.
          xcrun simctl launch "$UDID" com.recapcards.app
          sleep 20
          xcrun simctl terminate "$UDID" com.recapcards.app || true
          DATA=$(xcrun simctl get_app_container "$UDID" com.recapcards.app data)
          mkdir -p "$DATA/Documents/SQLite"
          rm -f "$DATA/Documents/SQLite/recap.db" "$DATA/Documents/SQLite/recap.db-wal" \
            "$DATA/Documents/SQLite/recap.db-shm"
          cp "$RUNNER_TEMP/recap.db" "$DATA/Documents/SQLite/recap.db"

          # Maestro only saves screenshots inside its own output folder: collect them after each
          # try, also when a later screen failed. The slow simulator sometimes misses a step, so a
          # stopped run is tried once more; the screens from both tries are kept.
          mkdir -p screenshots/maestro-logs
          status=0
          for attempt in 1 2; do
            out="$RUNNER_TEMP/maestro-$attempt"
            status=0
            maestro test --test-output-dir "$out" .maestro/screenshots.yaml || status=$?
            find "$out" -path "*takeScreenshot*" -name "*.png" -exec cp {} screenshots/ \;
            cp -R "$out" "screenshots/maestro-logs/attempt-$attempt" 2>/dev/null || true
            [ $status -eq 0 ] && break
            echo "Stopped early (attempt $attempt)"
          done
          echo "$(ls screenshots/*.png 2>/dev/null | wc -l | tr -d ' ') screenshots"
          exit $status
      - uses: actions/upload-artifact@v7
        if: always() && env.SCREENSHOTS == 'true'
        with:
          name: ios-screenshots
          path: app/screenshots/
          if-no-files-found: ignore
