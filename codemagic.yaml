# Codemagic (codemagic.io): builds the signed iPhone app on a Mac and uploads it to TestFlight.
# Unsigned compile checks run on GitHub Actions (.github/workflows/ios.yml).
# ios/ is generated by `expo prebuild` from app.json (never committed), so each build makes it.
workflows:
  ios-testflight:
    name: iOS to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: app
    integrations:
      app_store_connect: FloodShield App Store Connect # the same Apple account and API key as FloodShield
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.recapcards.app
      vars:
        XCODE_WORKSPACE: Recap.xcworkspace
        XCODE_SCHEME: Recap
        APP_STORE_APPLE_ID: 6822104894 # REPLACE with the app's Apple ID number
      node: 24
      xcode: latest
    scripts:
      - name: Install npm packages
        script: npm ci
      - name: Generate the iOS project from app.json
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Use the signing profiles Codemagic fetched
        script: xcode-project use-profiles --project ios/Recap.xcodeproj
      - name: Build number = last TestFlight build + 1 (Apple refuses repeated numbers)
        script: |
          cd ios
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build the signed .ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
